name: Publish blog posts

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily — ~9am Houston
  workflow_dispatch: {}

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: https://kbsjugijwmjpattzfmgi.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Top the queue back up to a rolling 90 days before drafting, so it never
      # runs dry and a newly-activated city is picked up within a day.
      - run: npm run blog:seed

      - run: npm run blog:generate

      # Committing to main triggers the existing Cloudflare deploy workflow.
      - name: Commit new posts
        run: |
          git config user.name "sitestac-bot"
          git config user.email "bot@sitestac.com"
          if git diff --quiet -- src/content/blog; then
            echo "No new posts."
            exit 0
          fi
          git add src/content/blog
          git commit -m "Blog: publish scheduled posts"
          git push
