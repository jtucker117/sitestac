name: Publish blog posts

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily — ~9am Houston
  workflow_dispatch: {}

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    env:
      SUPABASE_URL: https://kbsjugijwmjpattzfmgi.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22+, not 20: @supabase/supabase-js needs a native WebSocket and
          # throws at client construction without one.
          node-version: 22
          cache: npm
      - run: npm ci

      # Top the queue back up to a rolling 90 days before drafting, so it never
      # runs dry and a newly-activated city is picked up within a day.
      - run: npm run blog:seed

      - run: npm run blog:generate

      - name: Commit new posts
        id: commit
        run: |
          git config user.name "sitestac-bot"
          git config user.email "bot@sitestac.com"
          # Stage first, then check: new posts are untracked files, which
          # `git diff` on its own never sees.
          git add src/content/blog
          if git diff --cached --quiet -- src/content/blog; then
            echo "No new posts."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          git commit -m "Blog: publish scheduled posts"
          git push

      # Only now is a post actually published. Doing this before the push is
      # what let three posts get marked done and then thrown away.
      - name: Confirm published in the ledger
        if: steps.commit.outputs.published == 'true'
        run: npm run blog:confirm

  # This push is authenticated with GITHUB_TOKEN, which GitHub deliberately
  # stops from triggering further workflows — so deploy.yml's `on: push` never
  # fires for it. Call the deploy directly instead.
  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
